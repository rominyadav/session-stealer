<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cookie Extractor Settings</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
    .section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .section h3 { margin-top: 0; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    textarea { height: 100px; resize: vertical; }
    .toggle { display: flex; align-items: center; gap: 10px; }
    .toggle input[type="checkbox"] { width: auto; }
    .save-btn { background: #4285f4; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    .save-btn:hover { background: #3367d6; }
    .status { margin-top: 10px; padding: 10px; border-radius: 4px; display: none; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  </style>
</head>
<body>
  <h1>Cookie Extractor Settings</h1>
  
  <div class="section">
    <h3>Auto-Scraping Configuration</h3>
    <div class="form-group">
      <div class="toggle">
        <input type="checkbox" id="autoScrapeEnabled">
        <label for="autoScrapeEnabled">Enable Auto-Scraping</label>
      </div>
    </div>
    <div class="form-group">
      <label for="scrapeInterval">Scraping Interval (minutes):</label>
      <select id="scrapeInterval">
        <option value="5">5 minutes</option>
        <option value="15">15 minutes</option>
        <option value="30">30 minutes</option>
        <option value="60">1 hour</option>
        <option value="180">3 hours</option>
        <option value="360">6 hours</option>
        <option value="720">12 hours</option>
        <option value="1440">24 hours</option>
      </select>
    </div>
  </div>
  
  <div class="section">
    <h3>Export Configuration</h3>
    <div class="form-group">
      <label for="exportMethod">Export Method:</label>
      <select id="exportMethod">
        <option value="download">Download to Local Directory</option>
        <option value="api">Upload to API Endpoint</option>
      </select>
    </div>
    <div class="form-group" id="apiConfig" style="display: none;">
      <label for="apiEndpoint">API Endpoint URL:</label>
      <input type="url" id="apiEndpoint" placeholder="https://your-api.com/upload">
      <label for="apiHeaders" style="margin-top: 10px;">Custom Headers (JSON format):</label>
      <textarea id="apiHeaders" placeholder='{"Authorization": "Bearer token", "Content-Type": "application/json"}'></textarea>
      <label for="curlCommand" style="margin-top: 10px;">Custom cURL Command Template:</label>
      <textarea id="curlCommand" placeholder="curl -X POST {API_URL} -H 'Content-Type: application/json' -d '{DATA}'"></textarea>
    </div>
  </div>
  
  <button id="saveSettings" class="save-btn">Save Settings</button>
  <div id="status" class="status"></div>
  
  <script src="options.js"></script>
</body>
</html>
