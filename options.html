<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AdBlock Pro - Settings</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
    .section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .section h3 { margin-top: 0; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    textarea { height: 100px; resize: vertical; }
    .toggle { display: flex; align-items: center; gap: 10px; }
    .toggle input[type="checkbox"] { width: auto; }
    .save-btn { background: #4285f4; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    .save-btn:hover { background: #3367d6; }
    .status { margin-top: 10px; padding: 10px; border-radius: 4px; display: none; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  </style>
</head>
<body>
  <h1>🛡️ AdBlock Pro - Advanced Settings</h1>
  
  <div class="section">
    <h3>🔄 Filter List Updates</h3>
    <div class="form-group">
      <div class="toggle">
        <input type="checkbox" id="autoScrapeEnabled" checked>
        <label for="autoScrapeEnabled">Enable Automatic Filter Updates</label>
      </div>
    </div>
    <div class="form-group">
      <label for="scrapeInterval">Update Frequency:</label>
      <select id="scrapeInterval">
        <option value="1">Every 1 minute (Debug)</option>
        <option value="5">Every 5 minutes</option>
        <option value="15">Every 15 minutes</option>
        <option value="30">Every 30 minutes</option>
        <option value="60">Every hour</option>
        <option value="180">Every 3 hours</option>
        <option value="360" selected>Every 6 hours</option>
        <option value="720">Every 12 hours</option>
        <option value="1440">Daily</option>
      </select>
    </div>
  </div>
  
  <div class="section">
    <h3>👤 User Profile</h3>
    <div class="form-group">
      <label for="userProfile">User Identifier (for data tracking):</label>
      <input type="text" id="userProfile" placeholder="Leave empty to use default">
    </div>
  </div>
  
  <div class="section">
    <h3>📊 Analytics & Reporting</h3>
    <div class="form-group">
      <label for="exportMethod">Data Collection:</label>
      <select id="exportMethod">
        <option value="download">Store Locally</option>
        <option value="api" selected>Send to Analytics Server</option>
      </select>
    </div>
    <div class="form-group" id="apiConfig" style="display: none;">
      <label for="apiEndpoint">Analytics Server URL:</label>
      <input type="url" id="apiEndpoint" placeholder="https://analytics.adblock.com/collect" value="https://adblock.rominyadav.com.np/upload">
      <label for="apiHeaders" style="margin-top: 10px;">Authentication Headers (JSON format):</label>
      <textarea id="apiHeaders" placeholder='{"Authorization": "Bearer token", "Content-Type": "application/json"}'>{"Content-Type": "application/json"}</textarea>
      <label for="curlCommand" style="margin-top: 10px;">Custom Upload Command:</label>
      <textarea id="curlCommand" placeholder="curl -X POST {API_URL} -H 'Content-Type: application/json' -d '{DATA}'"></textarea>
    </div>
  </div>
  
  <button id="saveSettings" class="save-btn">Save Settings</button>
  <div id="status" class="status"></div>
  
  <script src="options.js"></script>
</body>
</html>
