<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .extract-btn {
      width: 100%;
      padding: 12px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-bottom: 15px;
    }
    
    .extract-btn:hover {
      background: #3367d6;
    }
    
    .extract-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      text-align: center;
    }
    
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    
    .stats {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>Cookie Extractor</h3>
    <p>Security Research Tool</p>
  </div>
  
  <button id="extractBtn" class="extract-btn">Extract All Cookies</button>
  <button id="settingsBtn" class="extract-btn" style="background: #666;">Settings</button>
  
  <div id="status" class="status" style="display: none;"></div>
  
  <div class="stats">
    <p><strong>Note:</strong> This tool extracts cookies from all domains for security analysis purposes.</p>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
